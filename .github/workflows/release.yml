name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Compilar ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - eolo_express
          - eolo_express_legacy
          - eolo_standard
          - eolo_dron
          - eolo_dron_legacy
          - eolo_dron_legacy_low_power
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e ${{ matrix.env }}
      - name: Empaquetar binarios
        env:
          ENV_NAME: ${{ matrix.env }}
          TAG: ${{ github.ref_name }}
        run: |
          pkg=pkg/$ENV_NAME
          mkdir -p "$pkg"
          cp .pio/build/$ENV_NAME/{bootloader,partitions,firmware}.bin "$pkg/"
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin "$pkg/"
          cat > "$pkg/LEEME.txt" <<EOF
          EOLO $ENV_NAME $TAG

          Flashea las cuatro partes en sus offsets; no borres la flash completa
          si quieres conservar la calibración y la configuración guardadas.

          esptool.py --chip esp32 --baud 460800 write_flash -z \\
            0x1000 bootloader.bin 0x8000 partitions.bin \\
            0xe000 boot_app0.bin 0x10000 firmware.bin
          EOF
          (cd "$pkg" && zip -q "../../eolo-$ENV_NAME-$TAG.zip" *)
      - uses: actions/upload-artifact@v4
        with:
          name: eolo-${{ matrix.env }}
          path: eolo-${{ matrix.env }}-${{ github.ref_name }}.zip

  release:
    name: Publicar release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notas desde el CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "Firmware $TAG. Sin sección para esta versión en CHANGELOG.md." > notes.md
          fi
      - name: Crear o actualizar el release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --notes-file notes.md
          fi

  pages:
    name: Actualizar página de flasheo
    needs: release
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
