name: Pages

on:
  push:
    branches: [main]
    paths:
      - "flasher/**"
      - "scripts/build_flasher_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar sitio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar todos los releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          gh release list --limit 100 --json tagName,publishedAt,url \
            --jq '.[] | [.tagName, .publishedAt, .url] | @tsv' |
          while IFS=$'\t' read -r tag date url; do
            mkdir -p "releases/$tag"
            gh release download "$tag" -p 'eolo-*.zip' -D "releases/$tag"
            printf '{"tag": "%s", "date": "%s", "url": "%s"}\n' "$tag" "$date" "$url" > "releases/$tag/release.json"
          done
      - run: python3 scripts/build_flasher_site.py --releases releases --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
